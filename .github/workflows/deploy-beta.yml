          new="if(f){pick(f)}else{if(!scPlacePopup.hidden){scPlacePopup.hidden=true;selected=null;$('selected').replaceChildren();$('routeSelected').disabled=true;render();drawMiniMap()}const hazardPopup=document.getElementById('scHazDetailPopup');if(hazardPopup&&!hazardPopup.hidden){hazardPopup.querySelector('.scHazPopupHeader button')?.click()}}}drag=null;"
          assert s.count(old)==1, 'Expected exactly one base map marker selection handler'
