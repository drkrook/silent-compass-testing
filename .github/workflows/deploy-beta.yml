          p.write_text(s)
          PY
          # Beta-only repair: release stuck desktop mouse dragging without altering touch gestures.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/index.html')
          s=p.read_text()
          original="canvas.addEventListener('pointermove',e=>{if(!activeTouches.has(e.pointerId))return;"
          patched="canvas.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&activeTouches.has(e.pointerId)&&e.buttons===0){endPointer(e);return}if(!activeTouches.has(e.pointerId))return;"
          assert s.count(original)==1, 'Expected one map pointermove handler'
          s=s.replace(original,patched,1)
          original="canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);"
          patched="""canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);
          // Desktop mouseup can be lost when the browser releases capture outside the canvas.
          window.addEventListener('pointerup',e=>{if(e.pointerType==='mouse'&&activeTouches.has(e.pointerId))endPointer(e)},true);
          canvas.addEventListener('lostpointercapture',e=>{if(e.pointerType==='mouse'&&activeTouches.has(e.pointerId)){activeTouches.delete(e.pointerId);drag=null;gesture=null;pinchMoved=false}});
          window.addEventListener('blur',()=>{for(const id of activeTouches.keys()){try{canvas.releasePointerCapture(id)}catch(e){}}activeTouches.clear();drag=null;gesture=null;pinchMoved=false});"""
          assert s.count(original)==1, 'Expected one map pointer end handler'
          s=s.replace(original,patched,1)
          p.write_text(s)
          PY
