name: Deploy Silent Compass Beta
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta repository
        uses: actions/checkout@v4
        with:
          path: beta
      - name: Checkout stable source as initial beta baseline
        uses: actions/checkout@v4
        with:
          repository: drkrook/silent-compass-family-beta
          ref: main
          path: app
          persist-credentials: false
      - name: Apply beta-specific overrides
        shell: bash
        run: |
          if [ -d beta/overrides ]; then cp -a beta/overrides/. app/; fi
          cp beta/beta-assets/prepare-your-area.js app/prepare-your-area.js
          cp beta/beta-assets/state-map-packages.json app/state-map-packages.json
          cp beta/beta-assets/ledovia-compass-home.js app/ledovia-compass-home.js
          cp beta/beta-assets/ledovia-premium-home.* app/
          cp beta/beta-assets/ledovia-mountains.svg app/
          cp beta/beta-assets/ledovia-logo.svg app/
          cp beta/beta-assets/ledovia-landscape-*.svg app/
          cp beta/beta-assets/ledovia-scenic-v3.* app/
          cp beta/beta-assets/ledovia-landscape-*-v4.svg app/
          cp beta/beta-assets/ledovia-icon-*-v4.svg app/
          cp beta/beta-assets/ledovia-landscape-v4.css app/
          cp beta/beta-assets/ledovia-photo-v5.css app/
          cp beta/beta-assets/ledovia-clean-home-v6.css app/
          cp beta/beta-assets/ledovia-navigation-v7.* app/
          cp beta/beta-assets/ledovia-visual-v8.* app/
          cp beta/beta-assets/ledovia-menu-v9.* app/
          cp beta/beta-assets/ledovia-menu-v10.* app/
          cp beta/beta-assets/ledovia-android-back-v11.js app/
          cp beta/beta-assets/ledovia-compass-v12.* app/
          cp beta/beta-assets/ledovia-compass-v13.css app/
          cp beta/beta-assets/ledovia-desktop-v14.* app/
          cp beta/beta-assets/ledovia-icon-*.svg app/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/index.html')
          s=p.read_text()
          marker='</body></html>'
          assert s.count(marker)==1
          s=s.replace(marker,'<script src="./prepare-your-area.js?v=0861"></script>'+marker)
          s=s.replace('STABLE RELEASE v0.8.3','BETA v0.8.14')
          s=s.replace('Stable Release · Ready','Beta Testing · Ready')
          s=s.replace('BETA v0.8.3','BETA v0.8.14')
          s=s.replace('Family Preview · Ready','Beta Testing · Ready')
          # Remove the obsolete State resources label from the rendered beta page only.
          s=s.replace('<strong>📍 State resources</strong>','<strong hidden>📍 State resources</strong>')
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/index.html')
          s=p.read_text()
          marker='</body></html>'
          assert s.count(marker)==1, 'Beta closing body anchor missing'
          assert 'ledovia-compass-home.js' not in s, 'Duplicate compass injection'
          s=s.replace(marker,'<script src="./ledovia-compass-home.js?v=1"></script>'+marker)
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/index.html')
          s=p.read_text()
          marker='</body></html>'
          assert s.count(marker)==1
          assert 'ledovia-premium-home.js' not in s
          s=s.replace(marker,'<script src="./ledovia-premium-home.js?v=2"></script>'+marker)
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/index.html')
          s=p.read_text()
          marker='</body></html>'
          assert s.count(marker)==1
          assert 'ledovia-scenic-v3.js' not in s
          s=s.replace(marker,'<script src="./ledovia-scenic-v3.js?v=3"></script>'+marker)
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/index.html')
          s=p.read_text()
          marker='</body></html>'
          assert s.count(marker)==1
          assert 'ledovia-landscape-v4.css' not in s
          s=s.replace(marker,'<link rel="stylesheet" href="./ledovia-landscape-v4.css?v=4">'+marker)
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/index.html')
          s=p.read_text()
          marker='</body></html>'
          assert s.count(marker)==1
          assert 'ledovia-photo-v5.css' not in s
          s=s.replace(marker,'<link rel="stylesheet" href="./ledovia-photo-v5.css?v=5">'+marker)
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/index.html')
          s=p.read_text()
          marker='</body></html>'
          assert s.count(marker)==1
          assert 'ledovia-clean-home-v6.css' not in s
          s=s.replace(marker,'<link rel="stylesheet" href="./ledovia-clean-home-v6.css?v=6">'+marker)
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/index.html')
          s=p.read_text()
          marker='</body></html>'
          assert s.count(marker)==1
          assert 'ledovia-navigation-v7.js' not in s
          s=s.replace(marker,'<link rel="stylesheet" href="./ledovia-navigation-v7.css?v=7"><script src="./ledovia-navigation-v7.js?v=7"></script>'+marker)
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/index.html')
          s=p.read_text()
          marker='</body></html>'
          assert s.count(marker)==1
          assert 'ledovia-visual-v8.js' not in s
          s=s.replace(marker,'<link rel="stylesheet" href="./ledovia-visual-v8.css?v=8"><script src="./ledovia-visual-v8.js?v=8"></script>'+marker)
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/index.html')
          s=p.read_text()
          marker='</body></html>'
          assert s.count(marker)==1
          assert 'ledovia-menu-v9.js' not in s
          s=s.replace(marker,'<link rel="stylesheet" href="./ledovia-menu-v9.css?v=9"><script src="./ledovia-menu-v9.js?v=9"></script>'+marker)
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/index.html')
          s=p.read_text()
          marker='</body></html>'
          assert s.count(marker)==1
          assert 'ledovia-menu-v10.js' not in s
          s=s.replace(marker,'<link rel="stylesheet" href="./ledovia-menu-v10.css?v=10"><script src="./ledovia-menu-v10.js?v=10"></script>'+marker)
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/index.html')
          s=p.read_text()
          marker='</body></html>'
          assert s.count(marker)==1
          assert 'ledovia-android-back-v11.js' not in s
          s=s.replace(marker,'<script src="./ledovia-android-back-v11.js?v=11"></script>'+marker)
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/index.html')
          s=p.read_text()
          marker='</body></html>'
          assert s.count(marker)==1
          assert 'ledovia-compass-v12.js' not in s
          s=s.replace(marker,'<link rel="stylesheet" href="./ledovia-compass-v12.css?v=12"><script src="./ledovia-compass-v12.js?v=12"></script>'+marker)
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/index.html')
          s=p.read_text()
          marker='</body></html>'
          assert s.count(marker)==1
          assert 'ledovia-compass-v13.css' not in s
          s=s.replace(marker,'<link rel="stylesheet" href="./ledovia-compass-v13.css?v=13">'+marker)
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/index.html')
          s=p.read_text()
          marker='</body></html>'
          assert s.count(marker)==1
          assert 'ledovia-desktop-v14.js' not in s
          s=s.replace(marker,'<link rel="stylesheet" href="./ledovia-desktop-v14.css?v=14"><script src="./ledovia-desktop-v14.js?v=14"></script>'+marker)
          p.write_text(s)
          PY
          touch app/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload beta site
        uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - name: Deploy beta site
        id: deployment
        uses: actions/deploy-pages@v4
