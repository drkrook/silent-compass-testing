name: Deploy Silent Compass Beta
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta repository
        uses: actions/checkout@v4
        with:
          path: beta
      - name: Checkout stable source as initial beta baseline
        uses: actions/checkout@v4
        with:
          repository: drkrook/silent-compass-family-beta
          ref: main
          path: app
          persist-credentials: false
      - name: Apply beta-specific overrides
        shell: bash
        run: |
          if [ -d beta/overrides ]; then cp -a beta/overrides/. app/; fi
          cp beta/beta-assets/prepare-your-area.js app/prepare-your-area.js
          cp beta/beta-assets/state-map-packages.json app/state-map-packages.json
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/index.html')
          s=p.read_text()
          marker='</body></html>'
          assert s.count(marker)==1
          s=s.replace(marker,'<script src="./prepare-your-area.js?v=0860"></script>'+marker)
          s=s.replace('STABLE RELEASE v0.8.3','BETA v0.8.6')
          s=s.replace('Stable Release · Ready','Beta Testing · Ready')
          s=s.replace('BETA v0.8.3','BETA v0.8.6')
          s=s.replace('Family Preview · Ready','Beta Testing · Ready')
          # Remove the obsolete State resources label from the rendered beta page only.
          s=s.replace('<strong>📍 State resources</strong>','<strong hidden>📍 State resources</strong>')
          p.write_text(s)
          PY
          touch app/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload beta site
        uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - name: Deploy beta site
        id: deployment
        uses: actions/deploy-pages@v4
