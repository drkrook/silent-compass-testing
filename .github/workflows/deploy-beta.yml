name: Deploy Silent Compass Beta
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta repository
        uses: actions/checkout@v4
        with:
          path: beta
      - name: Checkout stable source as initial beta baseline
        uses: actions/checkout@v4
        with:
          repository: drkrook/silent-compass-family-beta
          ref: main
          path: app
          persist-credentials: false
      - name: Apply beta-specific overrides
        shell: bash
        run: |
          if [ -d beta/overrides ]; then cp -a beta/overrides/. app/; fi
          cp beta/beta-assets/prepare-your-area.js app/prepare-your-area.js
          cp beta/beta-assets/state-map-packages.json app/state-map-packages.json
          cp beta/beta-assets/ledovia-compass-home.js app/ledovia-compass-home.js
          cp beta/beta-assets/ledovia-premium-home.* app/
          cp beta/beta-assets/ledovia-mountains.svg app/
          cp beta/beta-assets/ledovia-logo.svg app/
          cp beta/beta-assets/ledovia-landscape-*.svg app/
          cp beta/beta-assets/ledovia-scenic-v3.* app/
          cp beta/beta-assets/ledovia-landscape-*-v4.svg app/
          cp beta/beta-assets/ledovia-icon-*-v4.svg app/
          cp beta/beta-assets/ledovia-landscape-v4.css app/
          cp beta/beta-assets/ledovia-photo-v5.css app/
          cp beta/beta-assets/ledovia-clean-home-v6.css app/
          cp beta/beta-assets/ledovia-navigation-v7.* app/
          cp beta/beta-assets/ledovia-visual-v8.* app/
          cp beta/beta-assets/ledovia-menu-v9.* app/
          cp beta/beta-assets/ledovia-menu-v10.* app/
          cp beta/beta-assets/ledovia-android-back-v11.js app/
          cp beta/beta-assets/ledovia-compass-v12.* app/
          cp beta/beta-assets/ledovia-compass-v13.css app/
          cp beta/beta-assets/ledovia-desktop-v14.* app/
          cp beta/beta-assets/ledovia-desktop-v15.css app/
          cp beta/beta-assets/ledovia-desktop-v16.* app/
          cp beta/beta-assets/ledovia-icon-*.svg app/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/index.html')
          s=p.read_text()
          marker='</body></html>'
          assert s.count(marker)==1
          s=s.replace(marker,'<script src="./prepare-your-area.js?v=0861"></script>'+marker)
          s=s.replace('STABLE RELEASE v0.8.3','BETA v0.8.31')
          s=s.replace('Stable Release · Ready','Beta Testing · Ready')
          s=s.replace('BETA v0.8.3','BETA v0.8.31')
          s=s.replace('Family Preview · Ready','Beta Testing · Ready')
          # Remove the obsolete State resources label from the rendered beta page only.
          s=s.replace('<strong>📍 State resources</strong>','<strong hidden>📍 State resources</strong>')
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/index.html')
          s=p.read_text()
          marker='</body></html>'
          assert s.count(marker)==1, 'Beta closing body anchor missing'
